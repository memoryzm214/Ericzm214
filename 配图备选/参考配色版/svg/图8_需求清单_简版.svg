ct x="66.0" y="936.0" width="1848.0" height="112.0" rx="10" fill="#E8EBDE" opacity="1" /><text font-family="Microsoft YaHei, Noto Sans SC, PingFang SC, SimHei, sans-serif" x="94.0" y="972.0" font-size="16" font-weight="700" fill="#465736" text-anchor="start" letter-spacing="0" opacity="1">说明</text><text font-family="Microsoft YaHei, Noto Sans SC, PingFang SC, SimHei, sans-serif" x="160.0" y="972.0" font-size="14" font-weight="400" fill="#5A5D52" text-anchor="start" letter-spacing="0" opacity="1">三类需求呈层级关系：基本需求是其余两类的实现前提——盲区提示与安全路径指引须以清晰的路权划分为基础，社会规范可视化与情感化设计亦以基本需求的满足为条件。</text><text font-family="Microsoft YaHei, Noto Sans SC, PingFang SC, SimHei, sans-serif" x="94.0" y="1012.0" font-size="14" font-weight="400" fill="#5A5D52" text-anchor="start" letter-spacing="0" opacity="1">故系统实施遵循“先基础后提升”的顺序：基本需求首轮全部落地，期望需求次轮实现，兴奋需求作为增值项择机部署。各需求的满意度系数与不满意度系数见表34。</text><line x1="56.0" y1="1074.0" x2="1924.0" y2="1074.0" stroke="#D2D2C8" stroke-width="1.3" stroke-linecap="butt" opacity="1"/><text font-family="Microsoft YaHei, Noto Sans SC, PingFang SC, SimHei, sans-serif" x="56.0" y="1098.0" font-size="12.5" font-weight="400" fill="#8A8D80" text-anchor="start" letter-spacing="0" opacity="1">图8  高校共享道路安全引导系统需求清单</text><text font-family="Microsoft YaHei, Noto Sans SC, PingFang SC, SimHei, sans-serif" x="1924.0" y="1098.0" font-size="12.5" font-weight="400" fill="#8A8D80" text-anchor="end" letter-spacing="0" opacity="1">需求项与分类取自表34《基于KANO模型的需求分类统计表》</text>
